<div class="app">

<div class="progress" id="progress"></div>
<section class="goal"><canvas id="goalGL" aria-label="目標の立体"></canvas><div class="goalLabel">YOUR MISSION<strong>この立体をつくろう</strong></div><div class="goalBottom"><span id="levelLabel">LEVEL 01 / 10</span><button class="cutBtn" id="cutBtn" hidden>断面表示 ON</button></div></section>
<section class="work" id="work"><div class="workCaption"><span id="phaseName">01 — LINE</span><strong id="workName">線を置こう</strong></div><canvas id="editor" aria-label="線の位置を変える操作エリア"></canvas><canvas id="resultView" aria-label="回転でできた立体"></canvas><div class="resultBubble" id="resultBubble"></div><div class="workFooter" id="workFooter">● 両端を動かす　／　線をつかんで移動</div><button class="replay" id="replay">↻ もう一度見る</button><div class="hint" id="help"><div class="huge">━ &nbsp;◯ &nbsp;◉</div><h2>1本の線から、立体を。</h2><p>線の両端を指で動かそう。<br>① 点のまわりに回すと「面」に。<br>② 線のまわりに回すと「立体」に。<br>上の立体と同じ形になったらクリア。</p><button id="helpClose">やってみる</button></div></section>
<div class="status"><div class="left"><span class="chipDot"></span><span>① 点のまわり</span><span style="margin:0 4px;color:#b8c6ce">→</span><span class="chipLine"></span><span>② 線のまわり</span></div><div class="right" id="levelCounter">01 / 10</div></div>
<div class="bottom"><button class="secondary" id="backBtn" aria-label="線を編集し直す" hidden>↶</button><button class="primary" id="mainBtn"><span id="btnIcon">↻</span><span id="btnText">回してみる</span></button></div>
</div>
<script>
(()=>{'use strict';

const LEVELS=[

 {kind:'torus',name:'リング',major:3,outer:1,inner:0,tip:'真ん中に穴をつくろう'},

const S={idx:0,phase:'edit',a:{x:1.3,y:-1.4},b:{x:2.3,y:-.9},drag:null,w:0,h:0,unit:30,cx:0,cy:0,tryParams:null,win:false,cut:true,muted:false,readyTime:0,spinStart:0,editCanvas:$('editor'),ctx:$('editor').getContext('2d'),raf:0};
let unlocked=0;try{unlocked=+(localStorage.getItem('dimension-unlocked')||0)}catch(e){}
let audio=null;
function tone(type='tap'){

 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;

const shaderV='attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}';

varying vec2 vUv;uniform vec2 uRes;uniform float uMajor,uOuter,uInner,uTime,uCut,uYaw;

if(hit>.5){vec3 n=normalAt(p);vec3 light=normalize(vec3(-.55,.86,1.05));float ndl=max(0.,dot(n,light));vec3 view=normalize(ro-p);vec3 hv=normalize(light+view);float spec=pow(max(0.,dot(n,hv)),36.);

function makeGL(canvas){

}
const goal3D=makeGL($('goalGL')),result3D=makeGL($('resultView'));

const fallbackCache=new Map();

 // It renders the same implicit rotational solid as the GPU shader, including cutaways.

 if(canvas.width!==rw||canvas.height!==rh){canvas.width=rw;canvas.height=rh}
 let key=[rw,rh,p.major,p.outer,p.inner,yaw.toFixed(2),cut?1:0].join(':');

 if(cached){ctx.putImageData(cached,0,0);return}

 let low=document.createElement('canvas');low.width=w;low.height=h;let lc=low.getContext('2d');let image=lc.createImageData(w,h),pixels=image.data;
 let norm=(a)=>{let q=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/q,a[1]/q,a[2]/q]};let dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];let cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 let sz=Math.max(1,p.major+p.outer),eye=[2.2*sz*Math.cos(yaw),1.38*sz,2.2*sz*Math.sin(yaw)],forward=norm(eye.map(z=>-z)),right=norm(cross(forward,[0,1,0])),up=cross(right,forward),light=norm([-.55,.86,1.05]);

   let dx=forward[0]+1.37*(uvx*right[0]+uvy*up[0]),dy=forward[1]+1.37*(uvx*right[1]+uvy*up[1]),dz=forward[2]+1.37*(uvx*right[2]+uvy*up[2]);

   if(disc>0){

     let d=scene(x,y,z);
     if(d<.0048*sz){hit=true;break}
     t+=Math.max(.012*sz,d*.86);
    }

     let nn=norm([scene(x+e,y,z)-scene(x-e,y,z),scene(x,y+e,z)-scene(x,y-e,z),scene(x,y,z+e)-scene(x,y,z-e)]);

     R=18*shade+20*ndl+118*spec+12*rim+8;
     G=116*shade+48*ndl+92*spec+64*rim+16;
     B=147*shade+45*ndl+105*spec+75*rim+23;
     if(isCut){R=R*.7+160*.3;G=G*.7+212*.3;B=B*.7+207*.3}
    }
   }

function renderGL(o,canvas,p,sec,yaw,cut){if(!o){software3D(canvas,p,yaw,cut);return}resizeGL(o,canvas);let {gl,uniform:u}=o;gl.useProgram(gl.getParameter(gl.CURRENT_PROGRAM));gl.uniform2f(u.uRes,canvas.width,canvas.height);gl.uniform1f(u.uMajor,p.major);gl.uniform1f(u.uOuter,p.outer);gl.uniform1f(u.uInner,p.inner);gl.uniform1f(u.uTime,sec);gl.uniform1f(u.uCut,cut?1:0);gl.uniform1f(u.uYaw,yaw);gl.drawArrays(gl.TRIANGLES,0,6)}
let yaw=.93, resultYaw=.93;
function render3D(){let p=LEVELS[S.idx];renderGL(goal3D,$('goalGL'),p,0,yaw,S.cut);if(['spin2','result','win'].includes(S.phase)){renderGL(result3D,$('resultView'),{...S.tryParams,major:p.major},0,resultYaw,S.cut)}}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function getParams(){let {a,b}=S,dx=b.x-a.x,dy=b.y-a.y,t=clamp(-(a.x*dx+a.y*dy)/Math.max(.0000001,dx*dx+dy*dy),0,1),mx=a.x+dx*t,my=a.y+dy*t;return{inner:Math.sqrt(mx*mx+my*my),outer:Math.max(Math.hypot(a.x,a.y),Math.hypot(b.x,b.y))}}
function draw(){let canvas=S.editCanvas,ctx=S.ctx,rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;let d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
 S.w=w;S.h=h;S.unit=Math.min(w/9.3,h/9.3);S.cx=w*.5;S.cy=h*.36;let sc=S.unit,cx=S.cx,cy=S.cy;
 const pos=(p)=>({x:cx+p.x*sc,y:cy+p.y*sc}),major=LEVELS[S.idx].major;
 ctx.save();ctx.lineWidth=1;ctx.strokeStyle='#eff4f7';
 for(let x=Math.ceil(-cx/sc);x<=(w-cx)/sc;x++){ctx.beginPath();ctx.moveTo(cx+x*sc,0);ctx.lineTo(cx+x*sc,h);ctx.stroke()}
 for(let y=Math.ceil(-cy/sc);y<=(h-cy)/sc;y++){ctx.beginPath();ctx.moveTo(0,cy+y*sc);ctx.lineTo(w,cy+y*sc);ctx.stroke()}
 // Guide rings are only very faint; no exact target radius is shown.
 ctx.setLineDash([2,6]);ctx.strokeStyle='#eef3f6';for(let r=1;r<=3;r++){ctx.beginPath();ctx.arc(cx,cy,r*sc,0,2*Math.PI);ctx.stroke()}ctx.restore();
 let y2=cy+major*sc;ctx.save();ctx.setLineDash([7,6]);ctx.lineWidth=2.3;ctx.strokeStyle='#e9a274';ctx.beginPath();ctx.moveTo(14,y2);ctx.lineTo(w-14,y2);ctx.stroke();ctx.restore();
 // The first axis is shown as a dot-with-ring: a physical axis pointing out of the screen.
 ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fillStyle='#fff5eb';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#e59b65';ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fillStyle='#e59b65';ctx.fill();
 ctx.fillStyle='#c08050';ctx.font='bold 11px system-ui';ctx.fillText('①',cx+15,cy-13);
 ctx.fillStyle='#c08050';ctx.font='bold 11px system-ui';ctx.fillText('②',w-31,y2-12);
 const pa=pos(S.a),pb=pos(S.b);
 if(S.phase==='spin1'){let p=getParams(),progress=clamp((performance.now()-S.spinStart)/1050,0,1),far=S.a.x*S.a.x+S.a.y*S.a.y>S.b.x*S.b.x+S.b.y*S.b.y?S.a:S.b,startAngle=Math.atan2(far.y,far.x);
 if(p.outer>.05){let end=startAngle+2*Math.PI*progress;ctx.beginPath();ctx.arc(cx,cy,p.outer*sc,startAngle,end,false);if(p.inner>.025)ctx.arc(cx,cy,p.inner*sc,end,startAngle,true);else ctx.lineTo(cx,cy);ctx.closePath();ctx.fillStyle='rgba(45,179,198,.25)';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(31,163,188,.36)';ctx.stroke()}
 let ang=2*Math.PI*progress,c=Math.cos(ang),s=Math.sin(ang),rot=p=>({x:cx+(p.x*c-p.y*s)*sc,y:cy+(p.x*s+p.y*c)*sc}),rA=rot(S.a),rB=rot(S.b);
 ctx.beginPath();ctx.moveTo(rA.x,rA.y);ctx.lineTo(rB.x,rB.y);ctx.strokeStyle='#078fac';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();return;}
 // Live preview of the theoretical swept 2D shape, faint when editing.
 if(S.phase==='edit'){let pp=getParams();ctx.beginPath();ctx.arc(cx,cy,pp.outer*sc,0,Math.PI*2);if(pp.inner>.035){ctx.moveTo(cx+pp.inner*sc,cy);ctx.arc(cx,cy,pp.inner*sc,0,Math.PI*2,true)}ctx.fillStyle='rgba(19,167,187,.055)';ctx.fill('evenodd')}
 ctx.save();ctx.lineCap='round';ctx.shadowColor='#1aa3b240';ctx.shadowBlur=13;ctx.strokeStyle='#087f9e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();ctx.restore();
 for(let [idx,p] of [pa,pb].entries()){ctx.beginPath();ctx.arc(p.x,p.y,idx===0?11:11,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#13a0b6';ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle='#13a0b6';ctx.fill()}
 if(S.drag){let p=S.drag.type==='a'?pa:S.drag.type==='b'?pb:null;if(p){ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.strokeStyle='#55bcd05e';ctx.lineWidth=2;ctx.stroke()}}
}
function toGamePoint(e){let r=S.editCanvas.getBoundingClientRect();return{x:(e.clientX-r.left-S.cx)/S.unit,y:(e.clientY-r.top-S.cy)/S.unit}}
function pixelPoint(p){return{x:S.cx+p.x*S.unit,y:S.cy+p.y*S.unit}}
function distanceSegment(point,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=clamp(((point.x-a.x)*dx+(point.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(point.x-(a.x+t*dx),point.y-(a.y+t*dy))}
function snapPoint(p){let dist=Math.hypot(p.x,p.y);if(dist<.19)return{x:0,y:0};let nearest=Math.round(dist*2)/2;if(Math.abs(dist-nearest)<.11&&nearest>0){let factor=nearest/dist;p={x:p.x*factor,y:p.y*factor}}return{x:clamp(p.x,-3.3,3.3),y:clamp(p.y,-3.3,3.3)}}
S.editCanvas.addEventListener('pointerdown',e=>{if(S.phase!=='edit')return;let r=S.editCanvas.getBoundingClientRect(),point={x:e.clientX-r.left,y:e.clientY-r.top},a=pixelPoint(S.a),b=pixelPoint(S.b),da=Math.hypot(point.x-a.x,point.y-a.y),db=Math.hypot(point.x-b.x,point.y-b.y);let type=da<29&&da<=db?'a':db<29?'b':distanceSegment(point,a,b)<20?'line':null;if(!type)return;S.drag={type,start:toGamePoint(e),a:{...S.a},b:{...S.b}};S.editCanvas.setPointerCapture(e.pointerId);S.editCanvas.classList.add('grabbing');e.preventDefault();tone('tap')});
S.editCanvas.addEventListener('pointermove',e=>{if(!S.drag)return;let p=toGamePoint(e),q=S.drag;if(q.type==='line'){let dx=p.x-q.start.x,dy=p.y-q.start.y;let a={x:q.a.x+dx,y:q.a.y+dy},b={x:q.b.x+dx,y:q.b.y+dy};let minX=Math.min(a.x,b.x),maxX=Math.max(a.x,b.x),minY=Math.min(a.y,b.y),maxY=Math.max(a.y,b.y);let corrX=minX< -3.3?-3.3-minX:maxX>3.3?3.3-maxX:0,corrY=minY< -3.3?-3.3-minY:maxY>3.3?3.3-maxY:0;S.a={x:a.x+corrX,y:a.y+corrY};S.b={x:b.x+corrX,y:b.y+corrY}}
 else S[q.type]=snapPoint(p);draw();e.preventDefault()});
for(let ev of ['pointerup','pointercancel','lostpointercapture'])S.editCanvas.addEventListener(ev,()=>{S.drag=null;S.editCanvas.classList.remove('grabbing');draw()});
// Drag either 3D view horizontally to inspect the goal/result.
function installOrbit(el,isGoal){let initial=null;el.addEventListener('pointerdown',e=>{initial=e.clientX;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(initial==null)return;let dx=e.clientX-initial;initial=e.clientX;if(isGoal)yaw+=dx*.009;else resultYaw+=dx*.009;render3D()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>initial=null)}
installOrbit($('goalGL'),true);installOrbit($('resultView'),false);
function setBubble(label,win){let b=$('resultBubble');b.textContent=label;b.className='resultBubble show'+(win?' win':'')}
function renderProgress(){let el=$('progress');el.innerHTML='';LEVELS.forEach((_,i)=>{let v=document.createElement('i');if(i<=S.idx)v.classList.add('on');el.append(v)});$('levelLabel').textContent='LEVEL '+String(S.idx+1).padStart(2,'0')+' / '+LEVELS.length;$('levelCounter').textContent=String(S.idx+1).padStart(2,'0')+' / '+LEVELS.length}
function display(){const isEdit=S.phase==='edit',anim=S.phase==='spin1'||S.phase==='spin2',win=S.phase==='win';$('work').classList.toggle('showResult',S.phase==='spin2'||S.phase==='result'||win);
 $('mainBtn').disabled=anim;$('btnIcon').textContent=win?'✓':isEdit?'↻':anim?'◌':'↶';$('btnText').textContent=win?'次のステージへ':isEdit?'回してみる':anim?'回転中…':'線を直す';$('backBtn').hidden=isEdit||anim||win;
 $('phaseName').textContent=isEdit?'01 — LINE':S.phase==='spin1'?'02 — SURFACE':'03 — SOLID';$('workName').textContent=isEdit?'線を置こう':S.phase==='spin1'?'線から面が生まれる':'回転してできた立体';$('workFooter').textContent='● 両端を動かす　／　線をつかんで移動';
 $('cutBtn').hidden=LEVELS[S.idx].inner<.01;$('cutBtn').textContent=S.cut?'断面表示 ON':'断面表示 OFF';$('replay').style.display=S.phase==='result'||win?'block':'none';renderProgress();draw();render3D()}
function startLevel(n){S.idx=(n+LEVELS.length)%LEVELS.length;S.phase='edit';S.win=false;S.cut=true;let p=LEVELS[S.idx];S.a={x:Math.min(2.1,p.outer*.65+.4),y:-1.3};S.b={x:Math.min(2.9,p.outer*.9+.7),y:-.65};$('resultBubble').className='resultBubble';S.tryParams=null;display()}
function launch(){if(S.phase!=='edit')return;S.tryParams=getParams();let p=LEVELS[S.idx],err=Math.max(Math.abs(S.tryParams.outer-p.outer),Math.abs(S.tryParams.inner-p.inner));S.win=err<.165;S.phase='spin1';S.spinStart=performance.now();$('resultBubble').className='resultBubble';tone('open');display();let loop=()=>{if(S.phase!=='spin1')return;draw();if(performance.now()-S.spinStart<1050){S.raf=requestAnimationFrame(loop)}else{S.phase='spin2';display();setTimeout(()=>{if(S.phase!=='spin2')return;S.phase=S.win?'win':'result';setBubble(S.win?'ぴったり！ 立体が完成 ✨':'おしい！ 形を見比べよう',S.win);if(S.win){tone('win');burst();if(S.idx>=unlocked){unlocked=Math.min(LEVELS.length-1,S.idx+1);try{localStorage.setItem('dimension-unlocked',String(unlocked))}catch(e){}}}else tone('fail');display()},670)}};S.raf=requestAnimationFrame(loop)}
function burst(){let host=$('work');for(let i=0;i<25;i++){let el=document.createElement('div');el.className='spark';el.style.left='50%';el.style.top='45%';el.style.background=i%3===0?'#f2c17a':i%3===1?'#35b9cb':'#77ddd2';let a=i*2.4,s=40+Math.random()*130;el.style.setProperty('--dx',Math.cos(a)*s+'px');el.style.setProperty('--dy',Math.sin(a)*s+'px');host.append(el);setTimeout(()=>el.remove(),900)}}
function revert(){S.phase='edit';S.win=false;$('resultBubble').className='resultBubble';display()}
$('mainBtn').onclick=()=>{if(S.phase==='edit')launch();else if(S.phase==='win')startLevel(S.idx+1);else if(S.phase==='result')revert()};$('backBtn').onclick=revert;
$('helpBtn').onclick=()=>{$('help').classList.add('open');tone('open')};$('helpClose').onclick=()=>$('help').classList.remove('open');$('soundBtn').onclick=()=>{S.muted=!S.muted;$('soundBtn').textContent=S.muted?'♩':'♫'};
$('cutBtn').onclick=()=>{S.cut=!S.cut;display()};$('replay').onclick=()=>{if(!S.tryParams)return;S.phase='spin1';S.spinStart=performance.now();S.win=false; // Replay without affecting correctness: recalculated below
 const p=LEVELS[S.idx];S.win=Math.max(Math.abs(S.tryParams.outer-p.outer),Math.abs(S.tryParams.inner-p.inner))<.165;
 $('resultBubble').className='resultBubble';display();let loop=()=>{if(S.phase!=='spin1')return;draw();if(performance.now()-S.spinStart<1050)requestAnimationFrame(loop);else{S.phase='spin2';display();setTimeout(()=>{if(S.phase!=='spin2')return;S.phase=S.win?'win':'result';setBubble(S.win?'ぴったり！ 立体が完成 ✨':'おしい！ 形を見比べよう',S.win);display()},670)}};requestAnimationFrame(loop)};
// Tap progress indicators to preview any lesson; avoids locking test content.
$('progress').addEventListener('click',e=>{let el=e.target.closest('i');if(!el)return;let n=Array.from($('progress').children).indexOf(el);if(n<0)return;tone('tap');startLevel(n)});$('progress').style.cursor='pointer';
window.addEventListener('resize',()=>{draw();render3D()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){draw();render3D()}});
startLevel(0);setTimeout(()=>{draw();render3D()},130);
})();
