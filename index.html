<html lang="ja">

<style>

.brand{display:flex;flex-direction:column;gap:3px}.brand b{font-size:20px;letter-spacing:.175em;font-weight:830;line-height:1}.brand span{font-size:9px;letter-spacing:.17em;color:#91a0a7;font-weight:650}.tools{display:flex;gap:7px}.icon{width:37px;height:37px;border:1px solid #e2e8e8;border-radius:13px;background:#fff;font-size:16px;color:#6e838a;display:grid;place-items:center;box-shadow:0 2px 9px #14384808}.icon.is-off{opacity:.38}

.goal canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.goalLabel{position:absolute;z-index:2;left:19px;top:18px;pointer-events:none;color:#a5c2c9;font-size:10px;font-weight:750;letter-spacing:.19em}.goalLabel b{display:block;color:#fff;font-size:16px;letter-spacing:.02em;margin-top:8px;font-weight:760}.goalFooter{position:absolute;z-index:2;bottom:16px;left:19px;right:17px;pointer-events:none;display:flex;align-items:center;justify-content:space-between;color:#9bb5bd;font-size:10px;letter-spacing:.09em}.pill{border:1px solid #ffffff24;border-radius:99px;padding:5px 10px;color:#c7e0e5;background:#ffffff0e}

.controls{display:flex;gap:9px}.primary{height:60px;flex:1;border:0;border-radius:18px;background:linear-gradient(110deg,#14b0bd,#0b91a8);color:#fff;font-size:16px;font-weight:780;letter-spacing:.08em;box-shadow:0 10px 21px #0b97aa26;transition:transform .12s,opacity .2s}.primary:active{transform:scale(.985)}.primary:disabled{opacity:.65}.secondary{height:60px;width:58px;border:1px solid #e3eceb;border-radius:18px;background:#fff;color:#50818a;font-size:21px}.secondary[hidden]{display:none}

@media(max-height:740px){.app{gap:8px;padding-top:calc(env(safe-area-inset-top) + 9px);padding-bottom:calc(env(safe-area-inset-bottom) + 9px)}.goal{height:clamp(136px,21dvh,170px)}.work{min-height:259px}.primary,.secondary{height:53px}.bar{font-size:10px}}

</head>
<body>
<div class="app">
<header><div class="brand"><b>DIMENSION</b><span>ONE LINE. TWO TURNS. THREE DIMENSIONS.</span></div><div class="tools"><button class="icon" id="sound" aria-label="音の切り替え">♫</button><button class="icon" id="helpBtn" aria-label="遊び方">?</button></div></header>
<div class="progress" id="progress"></div>
<section class="goal"><canvas id="goal" aria-label="目標立体"></canvas><div class="goalLabel">YOUR MISSION<b>この立体をつくろう</b></div><div class="goalFooter"><span id="goalCount">LEVEL 01 / 10</span><span id="shapeType" class="pill">SOLID</span></div></section>
<section class="work" id="work"><canvas id="stage" aria-label="線を動かし、回転して立体にする"></canvas><div class="stageHead"><div class="headTitle"><small id="phaseSmall">01 / LINE</small><strong id="phaseTitle">線を置こう</strong></div><div class="phaseTags"><span id="tag1" class="on">① 線 → 面</span><span id="tag2" class="second">② 面 → 立体</span></div></div><div class="workFooter" id="workFooter">線の端を動かして、形を予想しよう</div><div class="resultTag" id="resultTag"></div><button class="replay" id="replay">↻ もう一度見る</button><div class="modal" id="help"><div class="glyph">━　◯　◉</div><h2>線から、立体へ。</h2><p>線の端を指で動かそう。<br>① 水色の軸のまわりで、線が面に。<br>② オレンジの軸のまわりで、面が立体に。<br>画面は切り替わらず、同じ線が変化していくよ。</p><button id="helpClose">遊んでみる</button></div></section>
<div class="bar"><div class="legend"><span class="dot"></span> ① 水色の軸　<span style="color:#a9b5b5">·</span> <span class="dash"></span> ② オレンジの軸</div><span class="count" id="count">01 / 10</span></div>
<div class="controls"><button class="secondary" id="back" hidden aria-label="線に戻す">↶</button><button class="primary" id="main">↻ &nbsp;回してみる</button></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const LEVELS=[
 {name:'はじめての球',kind:'sphere',major:0,outer:1.5,inner:0},
 {name:'大きな球',kind:'sphere',major:0,outer:2.5,inner:0},
 {name:'リング',kind:'torus',major:3,outer:1,inner:0},
 {name:'ふっくらリング',kind:'torus',major:3,outer:1.5,inner:0},
 {name:'空洞の球',kind:'shell',major:0,outer:2.5,inner:1},
 {name:'細いリング',kind:'torus',major:3.5,outer:.75,inner:0},
 {name:'薄い球殻',kind:'shell',major:0,outer:2.5,inner:1.75},
 {name:'空洞の輪',kind:'tube',major:3.5,outer:1.5,inner:.75},
 {name:'大きな輪',kind:'torus',major:3,outer:2,inner:0},
 {name:'マスター',kind:'tube',major:3.5,outer:2,inner:1}
];
const S={needsDraw:true,level:0,phase:'edit',a:{x:1.2,y:-1},b:{x:2.2,y:-.3},drag:null,try:null,win:false,muted:false,started:0,token:0,camEase:0,lastPhase:'',p3d:0};
const stage=$('stage'),ctx=stage.getContext('2d'),goal=$('goal'),gctx=goal.getContext('2d');
try{S.muted=localStorage.getItem('dimension-muted')==='yes'}catch(e){}
$('sound').classList.toggle('is-off',S.muted);

function sound(type){if(type==='tap')note(392,0,.09,.014);else if(type==='turn')note(440,0,.24,.028);else if(type==='win')[[523.25,0],[659.25,.13],[783.99,.26],[1046.5,.40]].forEach(([f,t])=>note(f,t,.64,.032));else if(type==='try')note(329.63,0,.13,.017);}
function resizeCanvas(c,cc,lim=2){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,lim),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}cc.setTransform(d,0,0,d,0,0);return{w:r.width,h:r.height}}
function params(){let a=S.a,b=S.b,dx=b.x-a.x,dy=b.y-a.y,t=clamp(-(a.x*dx+a.y*dy)/Math.max(1e-9,dx*dx+dy*dy),0,1),px=a.x+dx*t,py=a.y+dy*t;return{inner:Math.hypot(px,py),outer:Math.max(Math.hypot(a.x,a.y),Math.hypot(b.x,b.y)),major:LEVELS[S.level].major}}
const ease=t=>t*t*(3-2*t);
function camera(w,h,outputMix){let L=LEVELS[S.level],r=Math.max(L.outer,params().outer),base=Math.min(w/8.5,h/(8.3+L.major*.18)),finish=Math.min(w/(2.6*(L.major+r+1)),h/(2.5*(L.major+r+1)));const scale=base+(finish-base)*ease(outputMix),cx=w*.5,cy=h*.455-L.major*.80*scale*ease(outputMix);return {scale,cx,cy};}
function projection(x,y,z,cam){return{x:cam.cx+cam.scale*(.75*x+.661438*z),y:cam.cy+cam.scale*(.16*x+.97*y-.1814*z),depth:-.64*x+.24*y+.73*z}}
function project(p,cam){return projection(p.x,p.y,p.z||0,cam)}
function fromScreen(sx,sy,cam){let x=(sx-cam.cx)/(.75*cam.scale);return{x,y:((sy-cam.cy)/cam.scale-.16*x)/.97}}
function path(points,c,fill,stroke,width=1){if(!points.length)return;c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.lineWidth=width;c.strokeStyle=stroke;c.stroke()}}
function stroke(points,c,color,width=1,dash=[]){if(points.length<2)return;c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle=color;c.lineWidth=width;c.setLineDash(dash);c.stroke();c.setLineDash([])}
function drawAxes(c,cam,L,opts={}){const strong=opts.strong||'both',o=strong==='second'?1:.6;
 // Both axes remain literally in the same three-dimensional scene during all phases.
 const aa=project({x:0,y:0,z:-2.15},cam),ab=project({x:0,y:0,z:2.15},cam);
 stroke([aa,ab],c,`rgba(35,172,188,${strong==='first'?.83:.37})`,strong==='first'?2.3:1.6,[4,6]);
 const ax=project({x:-4.0,y:L.major,z:0},cam),ay=project({x:4,y:L.major,z:0},cam);
 stroke([ax,ay],c,`rgba(230,159,100,${strong==='second'?.19:.10})`,8);
 stroke([ax,ay],c,`rgba(214,144,82,${strong==='second'?.96:.72})`,strong==='second'?2.6:2,[8,6]);
 let origin=project({x:0,y:0,z:0},cam);c.beginPath();c.arc(origin.x,origin.y,6.1,0,Math.PI*2);c.fillStyle='#f0fbfb';c.fill();c.strokeStyle='#0b9cb0';c.lineWidth=2;c.stroke();c.beginPath();c.arc(origin.x,origin.y,1.9,0,7);c.fillStyle='#0b9cb0';c.fill();
 c.font='750 11px system-ui';c.fillStyle='#148da1';c.fillText('①',ab.x+6,ab.y-8);c.fillStyle='#bd814b';c.fillText('②',ay.x-23,ay.y-10);
}
function drawStageBg(c,w,h,cam){c.clearRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,h);
 let grad=c.createRadialGradient(w*.49,h*.52,25,w*.49,h*.52,Math.max(w,h)*.62);grad.addColorStop(0,'rgba(223,249,246,.17)');grad.addColorStop(1,'rgba(243,247,245,0)');c.fillStyle=grad;c.fillRect(0,0,w,h);
 c.save();c.strokeStyle='#f2f5f4';c.lineWidth=.65;const step=cam.scale;let px=cam.cx%step,py=cam.cy%step;for(let x=px;x<w;x+=step){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=py;y<h;y+=step){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}c.restore();}
function ringCoords(R,r,cam,theta=0){let outer=[],inner=[];for(let i=0;i<=72;i++){let a=i/72*Math.PI*2;for(const [rad,arr] of [[R,outer],[r,inner]]){let x=rad*Math.cos(a),y=rad*Math.sin(a),L=LEVELS[S.level],ang=theta;arr.push(project({x,y:L.major+(y-L.major)*Math.cos(ang),z:(y-L.major)*Math.sin(ang)},cam))}}return {outer,inner}}
function drawDisk(c,cam,p,angle,opacity=1){if(opacity<=0)return;const N=64,T=8,L=LEVELS[S.level],quads=[];
 for(let j=0;j<N;j++){let a=j/N*Math.PI*2,b=(j+1)/N*Math.PI*2;for(let k=0;k<T;k++){let ra=p.inner+(p.outer-p.inner)*k/T,rb=p.inner+(p.outer-p.inner)*(k+1)/T;let pts=[];for(let [r,t] of [[ra,a],[rb,a],[rb,b],[ra,b]]){let x=r*Math.cos(t),y=r*Math.sin(t);pts.push(project({x,y:L.major+(y-L.major)*Math.cos(angle),z:(y-L.major)*Math.sin(angle)},cam))}let dep=pts.reduce((s,v)=>s+v.depth,0)/4;quads.push({pts,dep})}}
 quads.sort((a,b)=>a.dep-b.dep);c.save();c.globalAlpha=opacity;quads.forEach(({pts})=>path(pts,c,'#91dce1'));c.restore();let {outer,inner}=ringCoords(p.outer,p.inner,cam,angle);stroke(outer,c,`rgba(9,140,163,${.82*opacity})`,Math.max(1.2,1.9*opacity));if(p.inner>.03)stroke(inner,c,`rgba(13,140,155,${.68*opacity})`,1.4);
 for(let a of [0,Math.PI/2,Math.PI,3*Math.PI/2]){let seg=[];for(const r of [p.inner,p.outer]){let x=r*Math.cos(a),y=r*Math.sin(a);seg.push(project({x,y:L.major+(y-L.major)*Math.cos(angle),z:(y-L.major)*Math.sin(angle)},cam))}stroke(seg,c,`rgba(12,123,144,${.17*opacity})`,1.2)}
 let mx=0,my=p.outer,Lm=L.major;let marker=project({x:mx,y:Lm+(my-Lm)*Math.cos(angle),z:(my-Lm)*Math.sin(angle)},cam);c.beginPath();c.arc(marker.x,marker.y,4.4,0,7);c.fillStyle='#078ca5';c.fill();c.lineWidth=1.6;c.strokeStyle='#fff';c.stroke();
}
// Draw the true locus of the original line; every intermediate stroke is part of the same line.
function drawLine(c,cam,angle=0,withHandles=false){let cos=Math.cos(angle),sin=Math.sin(angle),rot=p=>project({x:p.x*cos-p.y*sin,y:p.x*sin+p.y*cos,z:0},cam),a=rot(S.a),b=rot(S.b);
 c.save();c.lineCap='round';c.shadowColor='#0ba7b548';c.shadowBlur=12;c.lineWidth=5.7;c.strokeStyle='#0a94ab';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.restore();
 if(withHandles){for(let q of [a,b]){c.beginPath();c.arc(q.x,q.y,12,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle='#079aad';c.lineWidth=2.6;c.stroke();c.beginPath();c.arc(q.x,q.y,3.1,0,7);c.fillStyle='#079aad';c.fill()}if(S.drag){let q=S.drag.type==='a'?a:S.drag.type==='b'?b:null;if(q){c.beginPath();c.arc(q.x,q.y,24,0,7);c.lineWidth=1.5;c.strokeStyle='#3cb9bd55';c.stroke()}}}
}
function drawSpin1(c,cam,f){const loops=54,n=Math.max(1,Math.ceil(loops*f));let a=S.a,b=S.b;
 for(let i=0;i<n;i++){const t1=(i/loops)*Math.PI*2,t2=(Math.min((i+1)/loops,f))*Math.PI*2;let pt=(p,t)=>project({x:p.x*Math.cos(t)-p.y*Math.sin(t),y:p.x*Math.sin(t)+p.y*Math.cos(t),z:0},cam),pts=[pt(a,t1),pt(b,t1),pt(b,t2),pt(a,t2)];path(pts,c,'rgba(55,188,197,.33)')}

}
const light=[.65,-.86,1.2];
function normal(x,y,z){let d=Math.hypot(x,y,z)||1;return [x/d,y/d,z/d]}
function surfPoint(alpha,beta,R,M,inner=false){let x=R*Math.cos(alpha),y=R*Math.sin(alpha);return{x,y:M+(y-M)*Math.cos(beta),z:(y-M)*Math.sin(beta)}}
// For each boundary circle of the actual swept disk, beta traces the second rotation.
// At major=0, sweeping only the positive-radius semicircle avoids double rendering the sphere.
function drawSolid(c,cam,p,frac=1,opacity=1,forGoal=false){if(frac<.001||opacity<.003)return;let R=p.outer,M=p.major, sphere=M<.001;
 const A=forGoal?48:34,B=forGoal?54:42,aMax=sphere?Math.PI:Math.PI*2,bMax=2*Math.PI*frac,polys=[];
 for(let i=0;i<A;i++){let a=i/A*aMax,bb=(i+1)/A*aMax;for(let j=0;j<B*frac;j++){let u=j/B*2*Math.PI,v=Math.min(bMax,(j+1)/B*2*Math.PI);if(v<=u)continue;
 let q=[surfPoint(a,u,R,M),surfPoint(bb,u,R,M),surfPoint(bb,v,R,M),surfPoint(a,v,R,M)];let pts=q.map(P=>project(P,cam)),dep=pts.reduce((s,x)=>s+x.depth,0)/4;
 let am=(a+bb)/2,bm=(u+v)/2;let nx=Math.cos(am),ny=(sphere?1:-1)*Math.sin(am)*Math.cos(bm),nz=(sphere?1:-1)*Math.sin(am)*Math.sin(bm);let nd=Math.max(0,(nx*light[0]+ny*light[1]+nz*light[2])/1.6),view=Math.max(0,ny*-.22+nz*.94+nx*.10),rim=Math.pow(1-view,2.2),gleam=Math.pow(Math.max(0,ny*.1+nz*.8+nx*.33),14);
 let t=Math.min(1,.44+.45*nd+.22*view+.16*gleam-.065*rim);let rgb=forGoal?[Math.round(14+43*t),Math.round(123+93*t),Math.round(138+97*t)]:[Math.round(7+37*t),Math.round(133+88*t),Math.round(156+80*t)];
 polys.push({pts,dep,color:`rgb(${rgb.join(',')})`})}}
 polys.sort((a,b)=>a.dep-b.dep);c.save();c.globalAlpha=opacity;
 for(let k of polys){path(k.pts,c,k.color,k.color,1.6)}c.restore();
 // For hollow shapes, make the missing interior legible without opaque cross-sectional cutting.
 if(p.inner>.01&&frac>=.999){const RR=p.inner,pts=[];for(let n=0;n<=80;n++){let a=n/80*Math.PI*2;pts.push(project({x:RR*Math.cos(a),y:RR*Math.sin(a),z:0},cam))}stroke(pts,c,forGoal?'rgba(196,251,250,.48)':'rgba(14,106,123,.32)',1.3,[3,5]);}
}
function drawSpin2(c,cam,p,f){let t=f*2*Math.PI;
 // All parts share the exact same orthographic camera. The volume appears from the path of the moving disk.
 if(f>.012)drawSolid(c,cam,p,f,1);
 for(let n=3;n>=1;n--){let t0=Math.max(0,t-n*.16);if(t0<=0)continue;let outline=ringCoords(p.outer,p.inner,cam,t0);stroke(outline.outer,c,`rgba(55,182,199,${.13/(n*.9)})`,1.3)}
 drawDisk(c,cam,p,t,.38*clamp((1-f)/.24,0,1));
 let y=p.outer,orbit=[];for(let k=0;k<=45*f;k++){let a=k/45*Math.PI*2;orbit.push(project({x:0,y:p.major+(y-p.major)*Math.cos(a),z:(y-p.major)*Math.sin(a)},cam))}
 stroke(orbit,c,'rgba(214,158,96,.35)',1.35,[3,5]);
}
function stageDraw(now){const active=['spin1','hold','spin2'].includes(S.phase);if(!active&&!S.needsDraw){requestAnimationFrame(stageDraw);return;}S.needsDraw=false;let {w,h}=resizeCanvas(stage,ctx);const L=LEVELS[S.level],p=S.try||params();let f=0;
 if(S.phase==='spin1'){f=clamp((now-S.started)/1600,0,1);if(f===1){S.phase='hold';S.started=now;setText();sound('turn')}}
 if(S.phase==='hold'&&now-S.started>570){S.phase='spin2';S.started=now;setText()}
 if(S.phase==='spin2'){f=clamp((now-S.started)/2700,0,1);if(f===1){S.phase=S.win?'win':'result';S.started=now;S.camEase=1;setText();if(S.win){sound('win');confetti()}else sound('try')}}
 let mix=S.phase==='spin2'?ease(clamp((now-S.started)/2050,0,1)):['result','win'].includes(S.phase)?1:0;
 let cam=camera(w,h,mix);S.cam=cam;drawStageBg(ctx,w,h,cam);
 if(S.phase==='edit'){drawAxes(ctx,cam,L,{strong:'first'});drawLine(ctx,cam,0,true)}
 else if(S.phase==='spin1'){drawAxes(ctx,cam,L,{strong:'first'});drawSpin1(ctx,cam,f)}
 else if(S.phase==='hold'){drawAxes(ctx,cam,L,{strong:'first'});drawDisk(ctx,cam,p,0,.54)}
 else if(S.phase==='spin2'){drawAxes(ctx,cam,L,{strong:'second'});drawSpin2(ctx,cam,p,f)}
 else{drawAxes(ctx,cam,L,{strong:'second'});drawSolid(ctx,cam,p,1,.99)}
 requestAnimationFrame(stageDraw);
}
function drawGoal(){let {w,h}=resizeCanvas(goal,gctx,1.7);gctx.clearRect(0,0,w,h);const L=LEVELS[S.level],scale=Math.min(h/(2.32*(L.major+L.outer+.25)),w/(2.6*(L.major+L.outer+.3)))*(L.major>.01?.98:1.07);
 let cam={scale,cx:w*.63,cy:h*(L.major>.01?.47:.53)-L.major*.9*scale};drawSolid(gctx,cam,L,1,.99,true);
 
}
function setText(){S.needsDraw=true;let x=S.phase,edit=x==='edit',first=x==='spin1',hold=x==='hold',second=x==='spin2',win=x==='win';
 $('phaseSmall').textContent=edit?'01 / LINE':first||hold?'02 / SURFACE':second?'03 / SOLID':'COMPLETE';
 $('phaseTitle').textContent=edit?'線を置こう':first?'① 線が面になる':hold?'面ができた':second?'② 面が立体になる':win?'ぴったり！':'あと少し！';
 $('tag1').classList.toggle('on',first||hold||edit);$('tag2').classList.toggle('on',second||x==='result'||win);
 $('workFooter').classList.toggle('hidden',!edit);
 $('main').textContent=edit?'↻   回してみる':first||hold||second?'回転中…':win?'次のステージへ  →':'↶  線を直す';
 $('main').disabled=first||hold||second;$('back').hidden=edit||first||hold||second||win;
 $('replay').classList.toggle('show',x==='result'||win);
 $('resultTag').className='resultTag'+(x==='result'||win?' show':'')+(win?' win':'');$('resultTag').textContent=win?'完成！ すばらしい ✦':'惜しい！ もう一度';
}
function updateProgress(){let p=$('progress');p.innerHTML='';for(let i=0;i<LEVELS.length;i++){const el=document.createElement('i');if(i<=S.level)el.classList.add('on');if(i===S.level)el.classList.add('active');el.addEventListener('click',()=>startLevel(i));p.appendChild(el)}
 $('goalCount').textContent='LEVEL '+String(S.level+1).padStart(2,'0')+' / '+LEVELS.length;$('count').textContent=String(S.level+1).padStart(2,'0')+' / '+LEVELS.length;
 $('shapeType').textContent=LEVELS[S.level].inner>.01?'HOLLOW':LEVELS[S.level].major>.01?'RING':'SOLID';}
function startLevel(n){S.token++;S.level=(n+LEVELS.length)%LEVELS.length;S.phase='edit';S.try=null;S.win=false;S.a={x:Math.min(2.4,LEVELS[S.level].outer*.6+.45),y:-1.4};S.b={x:Math.min(2.9,LEVELS[S.level].outer*.92+.5),y:-.75};$('resultTag').className='resultTag';updateProgress();drawGoal();setText()}
function confetti(){const w=$('work');for(let i=0;i<29;i++){let e=document.createElement('span');e.className='confetti';e.style.left=(37+Math.random()*27)+'%';e.style.top=(37+Math.random()*20)+'%';e.style.background=i%4===0?'#e6b47d':i%3===0?'#abd9d8':'#20afba';e.style.setProperty('--dx',Math.round((Math.random()-.5)*250)+'px');e.style.setProperty('--dy',Math.round((Math.random()-.5)*250)+'px');w.appendChild(e);setTimeout(()=>e.remove(),870)}}
function play(replay=false){S.try=params();let L=LEVELS[S.level];S.win=Math.abs(S.try.outer-L.outer)<=.23&&Math.abs(S.try.inner-L.inner)<=.23;S.phase='spin1';S.started=performance.now();$('resultTag').className='resultTag';sound('turn');setText()}
const localPoint=e=>{let r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
const close=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function lineDist(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function snap(p){let rr=Math.hypot(p.x,p.y);if(rr<.17)return{x:0,y:0};let target=Math.round(rr*2)/2;if(Math.abs(rr-target)<.09){p.x*=target/rr;p.y*=target/rr}return{x:clamp(p.x,-3.25,3.25),y:clamp(p.y,-3.25,3.25)}}
stage.addEventListener('pointerdown',e=>{if(S.phase!=='edit')return;let screen=localPoint(e),a=project(S.a,S.cam),b=project(S.b,S.cam),da=close(screen,a),db=close(screen,b),type=da<32&&da<=db?'a':db<32?'b':lineDist(screen,a,b)<22?'line':null;if(!type)return;S.drag={type,start:fromScreen(screen.x,screen.y,S.cam),a:{...S.a},b:{...S.b}};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');sound('tap');e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!S.drag)return;let s=localPoint(e),p=fromScreen(s.x,s.y,S.cam),d=S.drag;
 if(d.type==='line'){let dx=p.x-d.start.x,dy=p.y-d.start.y;let aa={x:d.a.x+dx,y:d.a.y+dy},bb={x:d.b.x+dx,y:d.b.y+dy};let ox=Math.min(aa.x,bb.x)<-3.25?-3.25-Math.min(aa.x,bb.x):Math.max(aa.x,bb.x)>3.25?3.25-Math.max(aa.x,bb.x):0;let oy=Math.min(aa.y,bb.y)<-3.25?-3.25-Math.min(aa.y,bb.y):Math.max(aa.y,bb.y)>3.25?3.25-Math.max(aa.y,bb.y):0;S.a={x:aa.x+ox,y:aa.y+oy};S.b={x:bb.x+ox,y:bb.y+oy}}
 else S[d.type]=snap(p);S.needsDraw=true;e.preventDefault()});
for(let event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,()=>{S.drag=null;S.needsDraw=true;stage.classList.remove('dragging')});
$('main').addEventListener('click',()=>{if(S.phase==='edit')play();else if(S.phase==='win')startLevel(S.level+1);else if(S.phase==='result'){S.phase='edit';S.try=null;S.win=false;setText();sound('tap')}});
$('back').addEventListener('click',()=>{S.phase='edit';S.try=null;S.win=false;setText();sound('tap')});
$('replay').addEventListener('click',()=>play(true));
$('sound').addEventListener('click',()=>{S.muted=!S.muted;try{localStorage.setItem('dimension-muted',S.muted?'yes':'no')}catch(e){}$('sound').classList.toggle('is-off',S.muted);if(!S.muted)sound('tap')});
$('helpBtn').addEventListener('click',()=>{$('help').classList.add('open');sound('tap')});$('helpClose').addEventListener('click',()=>{$('help').classList.remove('open');sound('tap')});
window.addEventListener('resize',()=>{S.needsDraw=true;drawGoal()});
startLevel(0);requestAnimationFrame(stageDraw);
})();
</script>
</body>
