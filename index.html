function interfaceUpdate(){const p=stage();$('stageNo').innerHTML=String(S.n+1).padStart(2,'0')+'<small> / 12</small>';
 $('chapter').textContent=S.n<3?'CHAPTER 01 / DISCOVERY':S.n<6?'CHAPTER 02 / TWO AXES':S.n<9?'CHAPTER 03 / CHOOSE THE CENTER':'CHAPTER 04 / MASTER ORBITS';
 $('title').textContent=S.n===2?'真ん中を、空けよう。':S.n===3?'軸を選ぶと、輪が変わる。':S.n>=6?'どの軸で回す？':'緑だけ、つかまえよう。';
 $('sub').textContent=S.n===0?'棒を回すと、通り道は「輪っか」になる。':S.n===2?'穴を使えば、真ん中の赤を避けられる。':S.n>=3?'白い軸をタップ。棒は同じ長さのまま。':'緑を全部、赤はひとつも触れずに。';
 $('axisText').textContent=p.axes.length>1?'・軸 '+(S.axis+1):'';
 $('rangeValue').textContent=S.start+' — '+(S.start+p.width);
 $('widthText').textContent='長さ '+p.width+' 固定';
 $('minus').disabled=S.start<=0||S.phase==='spin';$('plus').disabled=S.start>=maxStart()||S.phase==='spin';
 $('spin').disabled=S.phase==='spin';$('spinLabel').textContent=S.phase==='spin'?'回転中…':'ひとまわし！';
 $('boardhint').style.opacity=(S.phase==='edit'?1:0);
 writeProgress()}
function startLevel(i){cancelAnimationFrame(raf);S.n=clamp(i,0,LEVELS.length-1);S.axis=0;const p=stage();S.start=p.solution[1]===0?1:0;S.phase='edit';S.win=false;S.hit=null;S.drag=false;$('result').className='result';interfaceUpdate();resize()}
function setStart(n){if(S.phase==='spin')return;S.start=clamp(Math.round(n),0,maxStart());S.phase='edit';$('result').className='result';interfaceUpdate();render()}
function setAxis(n){if(S.phase==='spin')return;S.axis=n;S.phase='edit';$('result').className='result';interfaceUpdate();sound('tap');render()}
function spin(){if(S.phase==='spin')return;S.phase='spin';S.sweepTime=performance.now();$('result').className='result';interfaceUpdate();sound('spin');cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
function finish(){if(S.phase!=='spin')return;let hit=calculate();S.phase=hit.win?'win':'result';S.hit=hit;S.win=hit.win;let el=$('result');el.className='result show'+(hit.win?'':' fail');$('resultTitle').textContent=hit.win?'ぴったり！':hit.bad?`赤を ${hit.bad} 個 通ってしまった`:`緑が ${hit.missing} 個 のこっている`;
 $('resultSub').textContent=hit.win?'棒が回って、輪になった。':hit.bad?'輪の中心や位置を変えてみよう。':'棒の位置や軸を変えてみよう。';$('next').textContent=hit.win?(S.n===LEVELS.length-1?'もう一度 ↻':'つぎへ →'):'なおす ↻';
 if(hit.win){S.clear[S.n]=true;try{localStorage.setItem('dimension-orbit-cleared',JSON.stringify(S.clear))}catch{}sound('win')}else{sound('fail')}
 interfaceUpdate();render()}
function coord(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function rodDragLocation(x,y){let [ax,ay]=axisPt(S.axis),a=dirForAxis(),[xx,yy]=world(x,y),dr=(xx-ax)*Math.cos(a)+(yy-ay)*Math.sin(a);return clamp(Math.round(dr-stage().width/2),0,maxStart())}
function checkAxis(x,y){let pts=stage().axes.map((p,i)=>({i,d:Math.hypot(...toPX(...p).map((v,j)=>v-[x,y][j]))}));pts.sort((a,b)=>a.d-b.d);return pts[0].d<=14?pts[0].i:-1}
canvas.addEventListener('pointerdown',e=>{if(S.phase==='spin')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);let [x,y]=coord(e),found=checkAxis(x,y);if(found>=0){if(found!==S.axis)setAxis(found);S.drag=false;return}
 let [ax,ay]=axisPt(S.axis),a=dirForAxis(),[xx,yy]=world(x,y),dr=(xx-ax)*Math.cos(a)+(yy-ay)*Math.sin(a),perp=Math.abs(-(xx-ax)*Math.sin(a)+(yy-ay)*Math.cos(a));
 if(perp<.75&&dr>=S.start-.5&&dr<=S.start+stage().width+.8){S.drag=true;S.dragOffset=dr-(S.start+stage().width/2);sound('tap')}else S.drag=false
});
canvas.addEventListener('pointermove',e=>{if(!S.drag)return;e.preventDefault();const [x,y]=coord(e),[ax,ay]=axisPt(S.axis),ang=dirForAxis(),[xx,yy]=world(x,y);let dr=(xx-ax)*Math.cos(ang)+(yy-ay)*Math.sin(ang);let newStart=clamp(Math.round(dr-S.dragOffset-stage().width/2),0,maxStart());if(newStart!==S.start){S.start=newStart;S.phase='edit';$('result').className='result';interfaceUpdate();render()}});
canvas.addEventListener('pointerup',e=>{S.drag=false});canvas.addEventListener('pointercancel',e=>{S.drag=false});
$('minus').addEventListener('click',()=>{if(S.start>0){setStart(S.start-1);sound('tap')}});
$('plus').addEventListener('click',()=>{if(S.start<maxStart()){setStart(S.start+1);sound('tap')}});
$('spin').addEventListener('click',spin);$('progress').addEventListener('click',e=>{let d=e.target.closest('i');if(d&&S.phase!=='spin'){startLevel(Number(d.dataset.level));sound('tap')}});
$('next').addEventListener('click',()=>{if(S.win){startLevel(S.n===LEVELS.length-1?0:S.n+1);sound('tap')}else{S.phase='edit';$('result').className='result';interfaceUpdate();render()}});
$('sound').textContent=S.muted?'♪̸':'♫';$('sound').addEventListener('click',()=>{S.muted=!S.muted;try{localStorage.setItem('dimension-orbit-sound',S.muted?'off':'on')}catch{}$('sound').textContent=S.muted?'♪̸':'♫';if(!S.muted)sound('tap')});
$('helpBtn').addEventListener('click',()=>{$('help').classList.add('open');sound('tap')});$('helpClose').addEventListener('click',()=>{$('help').classList.remove('open');sound('tap')});$('help').addEventListener('click',e=>{if(e.target===$('help'))$('help').classList.remove('open')});
window.addEventListener('resize',resize);startLevel(0);
})();
</script>
</body></html>
